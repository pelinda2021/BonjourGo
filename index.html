<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BonjourGo !</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eaf8ff;
      color: #23445c;
      text-align: center;
      padding: 40px 15px;
    }
    .carte {
      background: white;
      max-width: 600px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 25px;
      box-shadow: 0 4px 15px #c5dce8;
    }
    h1 { color: #159ac2; font-size: 42px; }
    button {
      background: #f5a742;
      border: none;
      padding: 15px 25px;
      border-radius: 12px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="carte">
    <h1>BonjourGo ! </h1>
    <h2>Bienvenue dans ton univers de français !</h2>
    <p>Jouer, découvrir et apprendre le français en s'amusant !</p>
    <button onclick="alert('Bienvenue dans ton cours de français !')">
      C'est parti !
    </button>
  </div>
</body>
</html>
